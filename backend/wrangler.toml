name = "software-engineering-project"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = [ "nodejs_compat" ]

# Bind a D1 database
[[d1_databases]]
binding = "DB"
database_name = "r59_db"
database_id = "CREATE_DATABASE_AND_PUT_ID_HERE"

# Bind an R2 bucket
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "r59-portfolio-images"

[vars]
# Add environment variables here (Square API keys, etc.)
# SQUARE_ACCESS_TOKEN = "..."
# SQUARE_ENVIRONMENT = "sandbox" # or production
