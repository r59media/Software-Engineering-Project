name = "software-engineering-project"
main = "src/index.ts"
compatibility_date = "2026-10-15"
compatibility_flags = [ "nodejs_compat" ]
preview_urls = false
minify = true

[build]
command = "pnpm run build"

[vars]
ADMIN_EMAIL = "r59mediatesting@gmail.com"
# Square webhook: set to https://<deployed-domain>/api/square/webhook (the exact URL registered in Square).
# Empty means the webhook returns 503. The signature key is set with `wrangler secret put SQUARE_WEBHOOK_SIGNATURE_KEY`.
SQUARE_WEBHOOK_URL = ""

[previews]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "r59_db"
database_id = "a774e6aa-39ec-4a9c-8206-48c57aeead87"


