name = "software-engineering-project"
main = "src/index.ts"
compatibility_date = "2026-10-15"
compatibility_flags = [ "nodejs_compat" ]
preview_urls = false
minify = true

[build]
command = "pnpm run build"

# Mutable production environment variables (SQUARE_ENVIRONMENT, SQUARE_WEBHOOK_URL,
# ADMIN_EMAIL, GOOGLE_CALENDAR_ID, GOOGLE_CLIENT_ID, etc.) are intentionally omitted
# from wrangler.toml so automated deploys (`wrangler deploy --minify --keep-vars`)
# NEVER overwrite client Cloudflare Dashboard settings back to sandbox/testing values.
# - Production values: configure in Cloudflare Dashboard (Workers & Pages -> Settings
#   -> Variables and Secrets) or via `wrangler secret put <NAME>`.
# - Local development values: place in `backend/.dev.vars` (already gitignored).

[previews]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = [ "/", "/index.html", "/reschedule", "/reschedule/*", "/faq", "/faq/*", "/api/*", "/admin", "/admin/*", "/assets/*.webp", "/assets/*.glb", "/assets/*.png", "/assets/*.jpg", "/assets/*.jpeg", "/models/*" ]

[[d1_databases]]
binding = "DB"
database_name = "r59_db"
database_id = "a774e6aa-39ec-4a9c-8206-48c57aeead87"

[triggers]
crons = ["0 6 * * *"]


