name = "software-engineering-project"
main = "src/index.ts"
compatibility_date = "2026-10-15"
compatibility_flags = [ "nodejs_compat" ]
preview_urls = false
minify = true

[build]
command = "pnpm run build"

[vars]
ADMIN_EMAIL = "r59mediatesting@gmail.com"
GOOGLE_CALENDAR_ID = "r59mediatesting@gmail.com"
GOOGLE_CLIENT_ID = "903574031170-h5dehd9irqrpd5ujki24dp1q91k23f9o.apps.googleusercontent.com"
# Square webhook: set to https://<deployed-domain>/api/square/webhook (the exact URL registered in Square).
# Empty means the webhook returns 503. The signature key is set with `wrangler secret put SQUARE_WEBHOOK_SIGNATURE_KEY`.
SQUARE_WEBHOOK_URL = ""
SQUARE_ENVIRONMENT = "sandbox"

[previews]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = [ "/", "/index.html", "/reschedule", "/reschedule/*", "/faq", "/faq/*", "/api/*", "/admin/*", "/assets/*.webp", "/models/*" ]

[[d1_databases]]
binding = "DB"
database_name = "r59_db"
database_id = "a774e6aa-39ec-4a9c-8206-48c57aeead87"

[triggers]
crons = ["0 6 * * *"]


