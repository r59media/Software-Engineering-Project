version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      frontend-patch:
        update-types:
          - "patch"
      frontend-minor:
        update-types:
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      admin-patch:
        update-types:
          - "patch"
      admin-minor:
        update-types:
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      backend-patch:
        update-types:
          - "patch"
      backend-minor:
        update-types:
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-patch:
        update-types:
          - "patch"
      github-actions-minor:
        update-types:
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
