name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    if: >-
      github.event.action != 'closed' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge safe patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 40); do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "verify")] | sort_by(.id) | last | if . then "\(.status):\(.conclusion // "")" else "" end')
            case "$result" in
              completed:success)
                gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
                exit 0
                ;;
              completed:*)
                echo "Check 'verify' finished with status: $result"
                exit 1
                ;;
              *)
                echo "Attempt $attempt/40: 'verify' status is '${result:-pending}', waiting 15s..."
                sleep 15
                ;;
            esac
          done
          echo "Timed out waiting for 'verify' check run on $HEAD_SHA"
          exit 1

  deploy:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.actor == 'github-actions[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
