name: Auto-Maintenance & Dependency Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            admin/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir admin install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile

      - name: Production dependency security audit (high/critical)
        run: |
          pnpm --dir frontend audit --prod --audit-level=high
          pnpm --dir admin audit --prod --audit-level=high
          pnpm --dir backend audit --prod --audit-level=high

      - name: Verify Frontend (lint, typecheck, build)
        run: pnpm --dir frontend run check

      - name: Verify Admin (strict typecheck)
        run: pnpm --dir admin run typecheck

      - name: Verify Backend (typecheck, build, test)
        run: |
          pnpm --dir backend run typecheck
          pnpm --dir backend run build
          pnpm --dir backend test
          pnpm --dir backend run ub:check

      - name: Send failure alert email via Resend
        if: failure() && github.event_name != 'pull_request'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          FROM_EMAIL: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM || 'onboarding@resend.dev' }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ADMIN_EMAIL" ]; then
            echo "Skipping alert email: RESEND_API_KEY or ADMIN_EMAIL not configured."
            exit 0
          fi
          payload=$(jq -n \
            --arg from "$FROM_EMAIL" \
            --arg to "$ADMIN_EMAIL" \
            --arg subject "[R59 Media] Verification Failure (${GITHUB_EVENT_NAME})" \
            --arg text "The ${GITHUB_WORKFLOW} (verify) job failed (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Event: ${GITHUB_EVENT_NAME}, Ref: ${GITHUB_REF_NAME}." \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          curl -fsS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "::warning::Failed to send Resend failure alert."

  api-and-security-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Full dependency audit (including devDependencies, informational)
        continue-on-error: true
        run: |
          pnpm --dir frontend audit --audit-level=high || echo "::warning::Non-production vulnerabilities detected in frontend devDependencies."
          pnpm --dir admin audit --audit-level=high || echo "::warning::Non-production vulnerabilities detected in admin devDependencies."
          pnpm --dir backend audit --audit-level=high || echo "::warning::Non-production vulnerabilities detected in backend devDependencies."

      - name: Check external API & CDN endpoints
        run: |
          curl -fsSI https://accounts.google.com/.well-known/openid-configuration
          curl -fsSI https://web.squarecdn.com/v1/square.js
          curl -fsSI https://sandbox.web.squarecdn.com/v1/square.js

      - name: Live production health & smoke check
        if: vars.PRODUCTION_URL != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE_URL="${PRODUCTION_URL%/}"
          echo "Checking live health at ${BASE_URL}/api/health"
          HEALTH_BODY=$(curl -fsS --max-time 15 "${BASE_URL}/api/health")
          echo "Health response: $HEALTH_BODY"
          echo "$HEALTH_BODY" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"|"ok"[[:space:]]*:[[:space:]]*true'
          curl -fsS --max-time 15 -o /dev/null "${BASE_URL}/"
          curl -fsS --max-time 15 -o /dev/null "${BASE_URL}/admin/"
          echo "Live production smoke checks passed."

      - name: Send failure alert email via Resend
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          FROM_EMAIL: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM || 'onboarding@resend.dev' }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ADMIN_EMAIL" ]; then
            echo "Skipping alert email: RESEND_API_KEY or ADMIN_EMAIL not configured."
            exit 0
          fi
          payload=$(jq -n \
            --arg from "$FROM_EMAIL" \
            --arg to "$ADMIN_EMAIL" \
            --arg subject "[R59 Media] Scheduled Health/Security Check Failed" \
            --arg text "The ${GITHUB_WORKFLOW} (api-and-security-health) job failed (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Event: ${GITHUB_EVENT_NAME}, Ref: ${GITHUB_REF_NAME}." \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          curl -fsS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "::warning::Failed to send Resend failure alert."
