name: Auto-Sync Frontend Assets & Branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build frontend & admin into backend/public
        run: |
          pnpm --dir backend install
          pnpm --dir backend run build

      - name: Commit and push changes if backend/public updated
        run: |
          if [ -n "$(git status --porcelain backend/public)" ]; then
            echo "Changes detected in backend/public. Committing and pushing..."
            git add backend/public
            git commit -m "chore(build): auto-sync compiled frontend assets into backend/public [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes in backend/public."
          fi

      - name: Fast-forward feature/frontend if ancestor of main
        run: |
          git fetch origin feature/frontend || true
          if git rev-parse --verify origin/feature/frontend >/dev/null 2>&1; then
            if git merge-base --is-ancestor origin/feature/frontend HEAD; then
              echo "origin/feature/frontend is an ancestor of HEAD. Fast-forwarding feature/frontend..."
              git push origin HEAD:refs/heads/feature/frontend
            else
              echo "origin/feature/frontend is not an ancestor of HEAD. Skipping fast-forward."
            fi
          else
            echo "origin/feature/frontend branch not found on remote."
          fi
